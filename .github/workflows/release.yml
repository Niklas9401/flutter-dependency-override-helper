name: Release

# Publishing is triggered by pushing a git tag:
#
#   v1.2.3           → publishes BOTH plugins with version 1.2.3
#   vscode-v1.2.3    → publishes only the VS Code extension
#   intellij-v1.2.3  → publishes only the IntelliJ / Android Studio plugin
#
# Required secrets and one-time setup: see RELEASING.md
on:
  push:
    tags:
      - 'v*'
      - 'vscode-v*'
      - 'intellij-v*'

permissions:
  contents: read

jobs:
  # Decides from the tag name what to publish and which version to use.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      vscode: ${{ steps.parse.outputs.vscode }}
      intellij: ${{ steps.parse.outputs.intellij }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}   # passed via env, never interpolated into the script
        run: |
          case "$TAG" in
            vscode-v*)   VERSION="${TAG#vscode-v}";   VSCODE=true;  INTELLIJ=false ;;
            intellij-v*) VERSION="${TAG#intellij-v}"; VSCODE=false; INTELLIJ=true  ;;
            v*)          VERSION="${TAG#v}";          VSCODE=true;  INTELLIJ=true  ;;
            *) echo "::error::Unsupported tag '$TAG'"; exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must end in a version like 1.2.3 (MAJOR.MINOR.PATCH)"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "vscode=$VSCODE"
            echo "intellij=$INTELLIJ"
          } >> "$GITHUB_OUTPUT"

  vscode-extension:
    name: Publish VS Code extension
    needs: prepare
    if: needs.prepare.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    environment: release          # optional: add required reviewers in the repo settings for a manual approval
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      # The version in package.json is overwritten with the one from the tag (not committed).
      - name: Set version from tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out "flutter-dependency-override-helper-$VERSION.vsix"

      # Fails with a clear error if the VSCE_PAT secret is missing.
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath "flutter-dependency-override-helper-$VERSION.vsix"

      # Open VSX serves VSCodium, Cursor, Gitpod, … – only runs if the OVSX_PAT secret exists.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish "flutter-dependency-override-helper-$VERSION.vsix" -p "$OVSX_PAT"

      - name: Open VSX skipped
        if: env.OVSX_PAT == ''
        run: echo "::warning::OVSX_PAT secret not set – skipped publishing to Open VSX."

      - uses: actions/upload-artifact@v4
        with:
          name: dist-vscode
          path: vscode-extension/*.vsix
          if-no-files-found: error

  intellij-plugin:
    name: Publish IntelliJ / Android Studio plugin
    needs: prepare
    if: needs.prepare.outputs.intellij == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Read by build.gradle.kts via providers.environmentVariable(...)
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test and build plugin
        run: gradle test buildPlugin -PpluginVersion="$VERSION" --no-daemon

      # The very first version must be uploaded manually on plugins.jetbrains.com (see RELEASING.md).
      # Until a token exists this step is skipped, the build artifact is still attached to the GitHub release.
      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH_TOKEN != ''
        run: gradle publishPlugin -PpluginVersion="$VERSION" --no-daemon

      - name: Marketplace upload skipped
        if: env.PUBLISH_TOKEN == ''
        run: echo "::warning::JETBRAINS_PUBLISH_TOKEN secret not set – skipped publishing to JetBrains Marketplace."

      - uses: actions/upload-artifact@v4
        with:
          name: dist-intellij
          path: intellij-plugin/build/distributions/*.zip
          if-no-files-found: error

  # Creates one GitHub release for the tag and attaches whatever was built.
  github-release:
    name: GitHub release
    needs: [prepare, vscode-extension, intellij-plugin]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
