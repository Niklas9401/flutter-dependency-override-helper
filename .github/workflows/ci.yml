name: CI

# Builds and tests both plugins on every pull request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test pubspec logic
        run: npm test

      # Proves the extension can be packaged (catches missing files, invalid package.json, …).
      - name: Package .vsix
        run: npx --yes @vscode/vsce@3 package --no-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: error

  intellij-plugin:
    name: IntelliJ / Android Studio plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the given Gradle version, so the build does not depend on a committed Gradle wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Test and build plugin
        run: gradle test buildPlugin --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: intellij-plugin/build/distributions/*.zip
          if-no-files-found: error
